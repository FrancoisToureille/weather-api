services:
  weather-api:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-nominatim}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      MET_NORWAY_USER_AGENT: ${MET_NORWAY_USER_AGENT:?MET_NORWAY_USER_AGENT must contain the application name and a real contact}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/docs.json').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s