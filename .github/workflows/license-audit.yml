name: License audit

on:
  push:
  pull_request:

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes license-checker --json > licenses.json
      - run: node scripts/check-licenses.js licenses.json